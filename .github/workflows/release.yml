# Builds a release when a version tag is pushed (git tag v0.2.0 && git push origin v0.2.0):
# tests, then the Windows exe and the Mac apps, then a DRAFT GitHub release with the files attached.
#
# Nothing goes out to users from here. The draft stays hidden until you publish it, and app updates
# only go out when you sign them on your own computer with build/publish_update.py (deploy/UPDATES.md).
# The signing key never comes near GitHub.
#
# Build check: Actions ▸ Release ▸ Run workflow builds everything the same way without a tag or a release;
# the files are kept with the run for 14 days.
#
# Each file gets a build attestation: proof it was built by this workflow from this repo's code, which
# you can check before signing:  gh attestation verify <file> -R jessiepullaro414/StitchPilot
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Check the tag matches the app version
        id: v
        run: |
          v=$(python3 -c 'import re; print(re.search(r"__version__\s*=\s*\"([^\"]+)\"", open("stitchpilot/__init__.py").read())[1])')
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match __version__ $v in stitchpilot/__init__.py"
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

  test:
    needs: version
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  windows:
    needs: [version, test]
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"
      - name: Build
        shell: pwsh
        run: |
          ./build/build_exe.ps1
          Move-Item dist/StitchPilot.exe "dist/StitchPilot-$env:VERSION.exe"
      - name: Self-test the exe (picture in, embroidery file out)
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP "selftest.pes"
          $p = Start-Process "dist/StitchPilot-$env:VERSION.exe" -Wait -PassThru `
            -ArgumentList "--selftest", (Resolve-Path tests/samples/badge.png), $out
          Get-Content "$out.txt" -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { throw "The packaged exe failed its self-test" }
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: dist/StitchPilot-${{ env.VERSION }}.exe
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: windows
          path: dist/StitchPilot-${{ env.VERSION }}.exe
          if-no-files-found: error
          retention-days: 14

  mac:
    needs: [version, test]
    strategy:
      fail-fast: false  # one Mac build failing shouldn't hide whether the other works
      matrix:
        include:
          - runner: macos-latest  # Apple Silicon
            arch: arm64
          - runner: macos-15-intel  # older Intel Macs
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    # The Apple signing secrets live in this environment. Give it yourself as required reviewer
    # (Settings ▸ Environments ▸ release) so they're only used when you approve the run. build/SIGNING.md
    environment: release
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"
      - name: Load the Apple signing certificate and notary key (skipped until they're set)
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ -z "$MACOS_CERT_P12" ]; then
            echo "::warning::No Apple signing certificate set: this Mac build is unsigned (build/SIGNING.md)"
            exit 0
          fi
          # a throwaway keychain, deleted at the end of the job (the runner itself is thrown away too)
          kc="$RUNNER_TEMP/signing.keychain-db"
          kcpw="$(openssl rand -hex 24)"
          security create-keychain -p "$kcpw" "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "$kcpw" "$kc"
          umask 077
          printf '%s' "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kcpw" "$kc" > /dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          identity="$(security find-identity -v -p codesigning "$kc" | grep -m1 -o '"Developer ID Application: [^"]*"' | tr -d '"')"
          if [ -z "$identity" ]; then
            echo "::error::The certificate in MACOS_CERT_P12 isn't a Developer ID Application certificate"
            exit 1
          fi
          echo "SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "SIGNING_KEYCHAIN=$kc" >> "$GITHUB_ENV"
          if [ -n "$APPLE_API_KEY_P8" ]; then
            printf '%s' "$APPLE_API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/notary.p8"
            xcrun notarytool store-credentials stitchpilot --key "$RUNNER_TEMP/notary.p8" \
              --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --keychain "$kc" > /dev/null
            rm -f "$RUNNER_TEMP/notary.p8"
            echo "NOTARY_PROFILE=stitchpilot" >> "$GITHUB_ENV"
            echo "NOTARY_KEYCHAIN=$kc" >> "$GITHUB_ENV"
          else
            echo "::warning::No notary key set: the Mac build is signed but not notarized (build/SIGNING.md)"
          fi
      - name: Build
        run: |
          bash build/build_mac.sh
          mv "dist/StitchPilot-mac-$ARCH.zip" "dist/StitchPilot-$VERSION-mac-$ARCH.zip"
      - name: Remove the signing keychain
        if: always()
        run: |
          if [ -n "${SIGNING_KEYCHAIN:-}" ]; then security delete-keychain "$SIGNING_KEYCHAIN" || true; fi
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: dist/StitchPilot-${{ env.VERSION }}-mac-${{ matrix.arch }}.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: mac-${{ matrix.arch }}
          path: dist/StitchPilot-${{ env.VERSION }}-mac-${{ matrix.arch }}.zip
          if-no-files-found: error
          retention-days: 14

  draft:
    if: github.event_name == 'push'  # a build check stops before this
    needs: [version, windows, mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write  # only this job can write, and it only makes a draft release
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          path: files
          merge-multiple: true
      - name: Make a draft release
        run: |
          cd files
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" * --draft --verify-tag --title "StitchPilot $VERSION" \
            --notes "Built by GitHub Actions from $GITHUB_SHA. Check a file with: gh attestation verify <file> -R $GH_REPO"
